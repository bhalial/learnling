# Push a tag like v0.3.1 and this builds the Windows installer and publishes it as a
# GitHub release; installed copies of Learnling pick it up from there and update themselves.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The toolchain is pinned for Node 20 (see the README).
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx electron-vite build
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The Chrome extension, zipped for the Chrome Web Store (uploaded there by hand), on the
      # release electron-builder just made. Same job, so the release is there before the upload.
      - run: npm run extension
      - name: Attach the Chrome extension
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path extension/out/* -DestinationPath "Learnling-extension-$version.zip"
          gh release upload "v$version" "Learnling-extension-$version.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
