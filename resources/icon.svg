<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Learnling</title>
  <!-- The app's own book, closed: leather cover, gold corners, the red test seal
       from the planner on the front and a blue ribbon marking this week. -->
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a3a2e"/>
      <stop offset="1" stop-color="#4f231c"/>
    </linearGradient>
  </defs>

  <!-- Ribbon, behind the book -->
  <path d="M164 200 V246 L178 234 L192 246 V200 Z" fill="#2b4a8a" stroke="#2b2118" stroke-width="7" stroke-linejoin="round"/>

  <!-- Page block peeking out on the right and bottom -->
  <rect x="44" y="30" width="186" height="190" rx="12" fill="#f6ecd6" stroke="#2b2118" stroke-width="8"/>
  <path d="M214 46 V204 M222 54 V210" stroke="#c9b48e" stroke-width="4" stroke-linecap="round"/>

  <!-- Cover -->
  <rect x="24" y="14" width="186" height="196" rx="14" fill="url(#leather)" stroke="#2b2118" stroke-width="8"/>
  <!-- Spine, with two gold bands -->
  <path d="M28 18 H60 V206 H28 Z" fill="#3f1c16"/>
  <path d="M60 18 V206" stroke="#2b2118" stroke-width="5"/>
  <path d="M30 48 H58 M30 176 H58" stroke="#e3b54a" stroke-width="7"/>
  <!-- Tooled gold border -->
  <rect x="74" y="30" width="122" height="164" rx="8" fill="none" stroke="#e3b54a" stroke-width="3.5" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.85"/>
  <!-- Gold corners -->
  <path d="M168 14 H196 A14 14 0 0 1 210 28 V56 Z" fill="#e3b54a" stroke="#2b2118" stroke-width="6" stroke-linejoin="round"/>
  <path d="M168 210 H196 A14 14 0 0 0 210 196 V168 Z" fill="#e3b54a" stroke="#2b2118" stroke-width="6" stroke-linejoin="round"/>

  <!-- The seal: the planner's test seal, scaled from its 40px box -->
  <g transform="translate(136 112) scale(2.55) translate(-20 -20)">
    <path d="M20 3 C 26 2, 29 6, 33 8 C 37 11, 37 16, 37 20 C 38 25, 35 29, 32 33 C 28 37, 24 37, 20 37 C 15 38, 11 35, 8 32 C 4 28, 3 24, 3 20 C 2 15, 5 11, 8 8 C 11 5, 15 3, 20 3 Z" fill="#a32c25" stroke="#2b2118" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="20" cy="20" r="11" fill="#8a2019" stroke="#c2463d" stroke-width="1.2"/>
    <path d="M20 11.5 L22.4 17.4 L28.6 17.6 L23.7 21.6 L25.4 27.8 L20 24.3 L14.6 27.8 L16.3 21.6 L11.4 17.6 L17.6 17.4 Z" fill="#f3d58a"/>
  </g>
</svg>
